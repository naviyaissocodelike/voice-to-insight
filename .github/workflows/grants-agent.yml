name: Grants Agent

on:
  schedule:
    # Daily at 13:00 UTC (~8am ET). Note: scheduled workflows only run on the
    # default branch, and GitHub may delay cron jobs by a few minutes.
    - cron: "0 13 * * *"
  workflow_dispatch: {}

# Never let two runs overlap — they'd race on the data files.
concurrency:
  group: grants-agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run grants agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: npm run grants

      - name: Commit updated data
        run: |
          git config user.name "grants-agent[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(grants): agent run $(date -u +%Y-%m-%d)"
            # In case anything landed on the branch while the agent ran
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "${GITHUB_REF_NAME}"
          fi
